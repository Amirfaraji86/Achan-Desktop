<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Achan</title>
  <desc id="desc">A custom open-gateway symbol representing opening a clear path.</desc>
  <defs>
    <linearGradient id="portal" x1="110" y1="400" x2="392" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31C9B1"/>
      <stop offset="0.58" stop-color="#58E4C5"/>
      <stop offset="1" stop-color="#E8C47A"/>
    </linearGradient>
    <linearGradient id="path" x1="256" y1="350" x2="256" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31C9B1"/>
      <stop offset="1" stop-color="#B7F6E7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(256 176) rotate(90) scale(160)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AE3C5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4AE3C5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="128" fill="#0A1518"/>
  <rect x="13" y="13" width="486" height="486" rx="127" stroke="#29464A" stroke-width="2" fill="none"/>
  <circle cx="256" cy="205" r="158" fill="url(#glow)"/>
  <!-- Open arch: two separated leaves form a gateway rather than a closed letterform. -->
  <path d="M136 393C132 322 143 241 174 180C194 140 222 116 256 103C290 116 318 140 338 180C369 241 380 322 376 393"
        fill="none" stroke="url(#portal)" stroke-width="31" stroke-linecap="round"/>
  <path d="M179 374C181 286 198 214 231 167C238 157 247 148 256 141"
        fill="none" stroke="#B7F6E7" stroke-opacity=".78" stroke-width="12" stroke-linecap="round"/>
  <path d="M333 374C331 286 314 214 281 167C274 157 265 148 256 141"
        fill="none" stroke="#E8C47A" stroke-opacity=".88" stroke-width="12" stroke-linecap="round"/>
  <!-- Clear path and rising spark. -->
  <path d="M256 352V230M221 265L256 226L291 265"
        fill="none" stroke="url(#path)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="103" r="9" fill="#F4D89A"/>
  <path d="M116 411H396" stroke="#29464A" stroke-width="3" stroke-linecap="round"/>
</svg>
