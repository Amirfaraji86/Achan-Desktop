name: Build Achan - Windows 7 SP1

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'core/**'
      - 'assets/**'
      - 'installer/**'
      - 'requirements*.txt'
      - 'version_info.txt'
      - 'updater_helper.py'
      - 'tests/**'
      - '.github/workflows/build-windows*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win7:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: resolve
        shell: pwsh
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Run release builds from the main branch only.'
          }
          $source = Get-Content 'main.py' -Raw
          if ($source -notmatch 'APP_VERSION\s*=\s*["''](?<version>\d+\.\d+\.\d+)["'']') {
            throw 'Could not read APP_VERSION from main.py.'
          }
          $version = $Matches.version
          $versionInfo = Get-Content 'version_info.txt' -Raw
          foreach ($resourceName in @('FileVersion', 'ProductVersion')) {
            $resourcePattern = "StringStruct\('$resourceName',\s*'(?<resourceVersion>\d+\.\d+\.\d+)'\)"
            $resourceMatch = [regex]::Match($versionInfo, $resourcePattern)
            if (-not $resourceMatch.Success) {
              throw "Could not read $resourceName from version_info.txt."
            }
            $resourceVersion = $resourceMatch.Groups['resourceVersion'].Value
            if ($resourceVersion -ne $version) {
              throw "main.py APP_VERSION ($version) does not match $resourceName ($resourceVersion)."
            }
          }
          $tag = 'v' + $version + '-win7'
          $shouldBuild = $true

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:EVENT_BEFORE -and
              $env:EVENT_BEFORE -notmatch '^0+$') {
            $previousRef = "$($env:EVENT_BEFORE):main.py"
            $previousSource = git show $previousRef 2>$null | Out-String
            if ($previousSource -match 'APP_VERSION\s*=\s*["''](?<previousVersion>\d+\.\d+\.\d+)["'']') {
              $previousVersionText = $Matches.previousVersion
              $currentSemVer = [version]$version
              $previousSemVer = [version]$previousVersionText
              if ($currentSemVer -lt $previousSemVer) {
                throw "APP_VERSION cannot move backwards from $previousVersionText to $version."
              }
              if ($currentSemVer -eq $previousSemVer) {
                $shouldBuild = $false
                Write-Host "APP_VERSION remains $version; this push is not a release. Skipping build."
              }
            }
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Achan $version | Windows 7 SP1 | $tag"

      - name: Set up Python 3.8.10 (Windows 7-compatible runtime)
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.8.10'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-win7.txt

      - name: Install and verify official Inno Setup 6.7.4
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
            Invoke-WebRequest -Uri $url -OutFile $installer
            $signature = Get-AuthenticodeSignature -FilePath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
              throw 'Official Inno Setup signature validation failed.'
            }
            $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup installer failed with exit code $($process.ExitCode)." }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6.7.4 compiler was not found after installation.' }

      - name: Download and verify Windows 7 networking runtime
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = $env:GITHUB_WORKSPACE
          $bin = Join-Path $root 'bin'
          $temp = Join-Path $env:RUNNER_TEMP 'achan-win7-runtime'
          $licenses = Join-Path $root 'licenses'
          New-Item -ItemType Directory -Force -Path $bin, $temp, $licenses | Out-Null

          $tunUrl = 'https://github.com/tun2proxy/tun2proxy/releases/download/v0.8.7/tun2proxy-x86_64-win7-windows-msvc.zip'
          $tunHash = '2910c6ea76b54d6894deb69d98e83b927f2cebfe9a4a9328a6223fa6bb03305e'
          $tunZip = Join-Path $temp 'tun2proxy-win7.zip'
          Invoke-WebRequest -Uri $tunUrl -OutFile $tunZip
          $actual = (Get-FileHash -Algorithm SHA256 $tunZip).Hash.ToLowerInvariant()
          if ($actual -ne $tunHash) { throw "tun2proxy Win7 SHA-256 mismatch: $actual" }
          $tunDir = Join-Path $temp 'tun2proxy'
          Expand-Archive -Path $tunZip -DestinationPath $tunDir -Force
          $tunExe = Get-ChildItem $tunDir -Recurse -File -Filter 'tun2proxy-bin.exe' | Select-Object -First 1
          if (-not $tunExe) { throw 'tun2proxy-bin.exe was not found in the Win7-target archive.' }
          Copy-Item $tunExe.FullName (Join-Path $bin 'tun2proxy-bin.exe') -Force

          $wintunUrl = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $wintunHash = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $wintunZip = Join-Path $temp 'wintun.zip'
          Invoke-WebRequest -Uri $wintunUrl -OutFile $wintunZip
          $actual = (Get-FileHash -Algorithm SHA256 $wintunZip).Hash.ToLowerInvariant()
          if ($actual -ne $wintunHash) { throw "Wintun SHA-256 mismatch: $actual" }
          $wintunDir = Join-Path $temp 'wintun'
          Expand-Archive -Path $wintunZip -DestinationPath $wintunDir -Force
          $wintunDll = Join-Path $wintunDir 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $wintunDll)) { throw 'The official x64 Wintun DLL was not found.' }
          Copy-Item $wintunDll (Join-Path $bin 'wintun.dll') -Force

          Get-ChildItem $wintunDir -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|README)' } | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $licenses ("Wintun-" + $_.Name)) -Force
          }

          try {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tun2proxy/tun2proxy/b7cd433/LICENSE' -OutFile (Join-Path $licenses 'tun2proxy-MIT.txt')
          } catch {
            'tun2proxy v0.8.7 is MIT licensed: https://github.com/tun2proxy/tun2proxy' | Set-Content (Join-Path $licenses 'tun2proxy-LICENSE-NOTICE.txt')
          }
          try {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/mpcabd/python-arabic-reshaper/v3.0.0/LICENSE' -OutFile (Join-Path $licenses 'arabic-reshaper-MIT.txt')
          } catch {
            'arabic-reshaper v3.0.0 is MIT licensed: https://github.com/mpcabd/python-arabic-reshaper' | Set-Content (Join-Path $licenses 'arabic-reshaper-LICENSE-NOTICE.txt')
          }
          try {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/MeirKriheli/python-bidi/v0.5.2/COPYING.LESSER' -OutFile (Join-Path $licenses 'python-bidi-LGPL-3.0.txt')
          } catch {
            'python-bidi v0.5.2 is LGPL-3.0 licensed: https://github.com/MeirKriheli/python-bidi' | Set-Content (Join-Path $licenses 'python-bidi-LICENSE-NOTICE.txt')
          }

          $vcUrl = 'https://aka.ms/vs/16/release/14.29.30157/VC_redist.x64.exe'
          $vc = Join-Path $root 'build\vc_redist.x64.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $vc) | Out-Null
          Invoke-WebRequest -Uri $vcUrl -OutFile $vc
          $sig = Get-AuthenticodeSignature $vc
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Microsoft Visual C++ 2019 Redistributable signature verification failed.'
          }

      - name: Build with Windows 7-compatible Python and PyInstaller
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'pip==24.3.1'
          python -m pip install --disable-pip-version-check -r requirements-win7.txt 'pyinstaller==5.13.2'
          python -c "import dns.message, dns.rdatatype, requests, certifi, arabic_reshaper; from bidi.algorithm import get_display; print('Win7 dependency imports: OK')"
          python -m compileall -q main.py core
          python -m unittest discover -s tests -v
          python -m pip check

          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Achan --icon assets/achan.ico --version-file version_info.txt --add-data "assets;assets" --collect-all dns --collect-all arabic_reshaper --collect-all bidi --collect-data certifi --hidden-import=dns.message --hidden-import=dns.rdatatype --hidden-import=bidi.algorithm main.py

          $app = Join-Path $env:GITHUB_WORKSPACE 'dist\Achan'
          $bin = Join-Path $app 'bin'
          $licenses = Join-Path $app 'licenses'
          New-Item -ItemType Directory -Force -Path $bin, $licenses | Out-Null
          Copy-Item 'bin\tun2proxy-bin.exe' (Join-Path $bin 'tun2proxy-bin.exe') -Force
          Copy-Item 'bin\wintun.dll' (Join-Path $bin 'wintun.dll') -Force
          Copy-Item 'LICENSE-ORIGINAL-MIT.txt' (Join-Path $licenses 'WebImmortalGuards-MIT.txt') -Force
          Copy-Item 'licenses\*' $licenses -Force
          Copy-Item 'THIRD_PARTY_NOTICES.md' (Join-Path $app 'THIRD_PARTY_NOTICES.md') -Force
          if (-not (Test-Path (Join-Path $app 'Achan.exe'))) { throw 'Achan.exe was not produced.' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AchanUpdater --workpath build\updater-work --distpath build\updater-dist --specpath build\updater-spec updater_helper.py
          if (-not (Test-Path 'build\updater-dist\AchanUpdater.exe')) { throw 'AchanUpdater.exe was not produced.' }
          Copy-Item 'build\updater-dist\AchanUpdater.exe' (Join-Path $app 'AchanUpdater.exe') -Force

      - name: Prepare Persian installer language
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $farsiUrl = 'https://raw.githubusercontent.com/jrsoftware/issrc/5bcadfcd05e9857a47a6880a2ac0694c9ab60122/Files/Languages/Unofficial/Farsi.isl'
          Invoke-WebRequest -Uri $farsiUrl -OutFile 'installer\Farsi.isl'
          if ((Get-Item 'installer\Farsi.isl').Length -lt 10000) { throw 'The Farsi installer translation download looks incomplete.' }

      - name: Compile Windows 7 installer and packages
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" '/DWin7Build=1' 'installer\Achan.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE" }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $setup = Join-Path $dist 'Achan-Setup-Windows-7-SP1-x64.exe'
          $portable = Join-Path $dist 'Achan-Portable-Windows-7-SP1-x64.zip'
          if (-not (Test-Path $setup)) { throw "Windows 7 Setup output was not produced: $setup" }

          Compress-Archive -Path (Join-Path $dist 'Achan') -DestinationPath $portable -CompressionLevel Optimal -Force
          $package = Join-Path $dist 'Achan-Distribution-Windows-7-SP1-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $setup $package -Force
          Copy-Item $portable $package -Force
          Copy-Item 'README_FA.md' $package -Force
          Get-ChildItem $package -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content (Join-Path $package 'SHA256SUMS.txt')
          $distribution = Join-Path $dist 'Achan-Distribution-Windows-7-SP1-x64.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $distribution -CompressionLevel Optimal -Force

          $setupItem = Get-Item $setup
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema_version = 1
            app_id = 'achan-desktop'
            version = $env:APP_VERSION
            tag = $env:RELEASE_TAG
            platform = 'windows-7-sp1-x64'
            installer = 'Achan-Setup-Windows-7-SP1-x64.exe'
            size_bytes = $setupItem.Length
            sha256 = $setupHash
            release_notes = (Get-Content 'RELEASE_NOTES_FA.md' -Raw)
          }
          $manifestPath = Join-Path $dist 'Achan-Update-Windows-7-SP1.json'
          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($manifestPath, $manifestJson, [System.Text.UTF8Encoding]::new($false))

      - name: Upload Windows 7 SP1 build artifact
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Achan-Windows-7-SP1-x64
          path: |
            dist/Achan-Setup-Windows-7-SP1-x64.exe
            dist/Achan-Portable-Windows-7-SP1-x64.zip
            dist/Achan-Distribution-Windows-7-SP1-x64.zip
            dist/Achan-Update-Windows-7-SP1.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows 7 SP1 GitHub Release
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $title = 'Achan — Windows 7 SP1'
          $notes = Get-Content 'RELEASE_NOTES_FA.md' -Raw
          $assets = @(
            'dist/Achan-Setup-Windows-7-SP1-x64.exe',
            'dist/Achan-Portable-Windows-7-SP1-x64.zip',
            'dist/Achan-Distribution-Windows-7-SP1-x64.zip',
            'dist/Achan-Update-Windows-7-SP1.json'
          )
          $assetNames = @($assets | ForEach-Object { Split-Path $_ -Leaf })

          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null
          $apiExitCode = $LASTEXITCODE
          if ($apiExitCode -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            $existingNames = @($release.assets | ForEach-Object { $_.name })
            $missingNames = @($assetNames | Where-Object { $_ -notin $existingNames })
            if ($release.immutable -eq $true) {
              if ($missingNames.Count -eq 0) {
                Write-Host "Immutable release $tag already contains every expected asset."
                exit 0
              }
              throw "Release $tag is immutable and is missing: $($missingNames -join ', '). Increase APP_VERSION before publishing again."
            }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading assets to release $tag failed." }
            if ($release.draft -eq $true) {
              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F draft=false -f "name=$title" -f "body=$notes" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Publishing draft release $tag failed." }
            } else {
              gh release edit $tag --title "$title" --notes "$notes"
              if ($LASTEXITCODE -ne 0) { throw "Updating release metadata for $tag failed." }
            }
          } else {
            gh release create $tag @assets --title "$title" --notes "$notes" --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Creating release $tag failed." }
          }
