name: Build Achan - Windows 10 and 11

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'main_qt.py'
      - 'qt_ui/**'
      - 'tools/validate_qml.py'
      - 'core/**'
      - 'assets/**'
      - 'installer/**'
      - 'requirements*.txt'
      - 'version_info.txt'
      - 'updater_helper.py'
      - 'tests/**'
      - '.github/workflows/build-windows*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: resolve
        shell: pwsh
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Run release builds from the main branch only.'
          }
          $source = Get-Content 'main.py' -Raw
          if ($source -notmatch 'APP_VERSION\s*=\s*["''](?<version>\d+\.\d+\.\d+)["'']') {
            throw 'Could not read APP_VERSION from main.py.'
          }
          $version = $Matches.version
          $qtSource = Get-Content 'main_qt.py' -Raw
          if ($qtSource -notmatch 'APP_VERSION\s*=\s*["''](?<qtVersion>\d+\.\d+\.\d+)["'']') {
            throw 'Could not read APP_VERSION from main_qt.py.'
          }
          if ($Matches.qtVersion -ne $version) {
            throw "main_qt.py APP_VERSION ($($Matches.qtVersion)) does not match the release version ($version)."
          }
          $versionInfo = Get-Content 'version_info.txt' -Raw
          foreach ($resourceName in @('FileVersion', 'ProductVersion')) {
            $resourcePattern = "StringStruct\('$resourceName',\s*'(?<resourceVersion>\d+\.\d+\.\d+)'\)"
            $resourceMatch = [regex]::Match($versionInfo, $resourcePattern)
            if (-not $resourceMatch.Success) {
              throw "Could not read $resourceName from version_info.txt."
            }
            $resourceVersion = $resourceMatch.Groups['resourceVersion'].Value
            if ($resourceVersion -ne $version) {
              throw "main.py APP_VERSION ($version) does not match $resourceName ($resourceVersion)."
            }
          }
          $tag = 'v' + $version + '-win10-11'
          $shouldBuild = $true

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:EVENT_BEFORE -and
              $env:EVENT_BEFORE -notmatch '^0+$') {
            $previousRef = "$($env:EVENT_BEFORE):main.py"
            $previousSource = git show $previousRef 2>$null | Out-String
            if ($previousSource -match 'APP_VERSION\s*=\s*["''](?<previousVersion>\d+\.\d+\.\d+)["'']') {
              $previousVersionText = $Matches.previousVersion
              $currentSemVer = [version]$version
              $previousSemVer = [version]$previousVersionText
              if ($currentSemVer -lt $previousSemVer) {
                throw "APP_VERSION cannot move backwards from $previousVersionText to $version."
              }
              if ($currentSemVer -eq $previousSemVer) {
                $shouldBuild = $false
                Write-Host "APP_VERSION remains $version; this push is not a release. Skipping build."
              }
            }
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Achan $version | Windows 10 and 11 | $tag"

      - name: Set up Python 3.13
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-qt.txt

      - name: Install matching Qt 6.12.0 MSVC deployment SDK
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtInstallRoot = Join-Path $env:RUNNER_TEMP 'qt-sdk'

          # PySide6 wheels provide the Qt runtime but do not include windeployqt.
          # Install the matching Qt SDK toolchain so deployment uses the same Qt release.
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0'
          if ($LASTEXITCODE -ne 0) { throw 'Installing aqtinstall failed.' }

          aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir $qtInstallRoot
          if ($LASTEXITCODE -ne 0) { throw 'Installing the Qt 6.12.0 MSVC 2022 SDK failed.' }

          $qtDir = Join-Path $qtInstallRoot '6.12.0\msvc2022_64'
          $windeployqt = Join-Path $qtDir 'bin\windeployqt.exe'
          $qmake = Join-Path $qtDir 'bin\qmake.exe'
          if (-not (Test-Path $windeployqt)) { throw "Qt deployment tool was not found: $windeployqt" }
          if (-not (Test-Path $qmake)) { throw "Qt qmake was not found: $qmake" }

          $sdkVersion = (& $qmake -query QT_VERSION | Out-String).Trim()
          if ($sdkVersion -ne '6.12.0') { throw "Qt SDK version mismatch: expected 6.12.0, found $sdkVersion." }
          $deployVersion = (& $windeployqt --version 2>&1 | Out-String)
          if ($deployVersion -notmatch '6\.12\.0') { throw "Unexpected windeployqt version: $deployVersion" }

          "QT_SDK_ROOT=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Qt deployment SDK ready: $sdkVersion"

      - name: Install and verify official Inno Setup 6.7.4
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
            Invoke-WebRequest -Uri $url -OutFile $installer
            $signature = Get-AuthenticodeSignature -FilePath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
              throw 'Official Inno Setup signature validation failed.'
            }
            $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup installer failed with exit code $($process.ExitCode)." }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6.7.4 compiler was not found after installation.' }

      - name: Download and verify Windows networking runtime
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = $env:GITHUB_WORKSPACE
          $bin = Join-Path $root 'bin'
          $temp = Join-Path $env:RUNNER_TEMP 'achan-runtime'
          $licenses = Join-Path $root 'licenses'
          New-Item -ItemType Directory -Force -Path $bin, $temp, $licenses | Out-Null

          $tunUrl = 'https://github.com/tun2proxy/tun2proxy/releases/download/v0.8.7/tun2proxy-x86_64-pc-windows-msvc.zip'
          $tunHash = '801396ff46776aac4d9a6660a2972dbeb70b68c90a95a38289126c756298f863'
          $tunZip = Join-Path $temp 'tun2proxy.zip'
          Invoke-WebRequest -Uri $tunUrl -OutFile $tunZip
          $actual = (Get-FileHash -Algorithm SHA256 $tunZip).Hash.ToLowerInvariant()
          if ($actual -ne $tunHash) { throw "tun2proxy SHA-256 mismatch: $actual" }
          $tunDir = Join-Path $temp 'tun2proxy'
          Expand-Archive -Path $tunZip -DestinationPath $tunDir -Force
          $tunExe = Get-ChildItem $tunDir -Recurse -File -Filter 'tun2proxy-bin.exe' | Select-Object -First 1
          if (-not $tunExe) { throw 'tun2proxy-bin.exe was not found in the official archive.' }
          Copy-Item $tunExe.FullName (Join-Path $bin 'tun2proxy-bin.exe') -Force

          $wintunUrl = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $wintunHash = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $wintunZip = Join-Path $temp 'wintun.zip'
          Invoke-WebRequest -Uri $wintunUrl -OutFile $wintunZip
          $actual = (Get-FileHash -Algorithm SHA256 $wintunZip).Hash.ToLowerInvariant()
          if ($actual -ne $wintunHash) { throw "Wintun SHA-256 mismatch: $actual" }
          $wintunDir = Join-Path $temp 'wintun'
          Expand-Archive -Path $wintunZip -DestinationPath $wintunDir -Force
          $wintunDll = Join-Path $wintunDir 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $wintunDll)) { throw 'The official x64 Wintun DLL was not found.' }
          Copy-Item $wintunDll (Join-Path $bin 'wintun.dll') -Force

          Get-ChildItem $wintunDir -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|README)' } | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $licenses ("Wintun-" + $_.Name)) -Force
          }
          if (-not (Get-ChildItem $licenses -File -ErrorAction SilentlyContinue | Where-Object Name -Like 'Wintun-*')) {
            'Wintun license/readme files were not present in the official archive. See https://www.wintun.net/.' | Set-Content (Join-Path $licenses 'Wintun-LICENSE-NOTICE.txt')
          }

          try {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tun2proxy/tun2proxy/b7cd433/LICENSE' -OutFile (Join-Path $licenses 'tun2proxy-MIT.txt')
          } catch {
            'tun2proxy v0.8.7: https://github.com/tun2proxy/tun2proxy (MIT License).' | Set-Content (Join-Path $licenses 'tun2proxy-LICENSE-NOTICE.txt')
          }

          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/mpcabd/python-arabic-reshaper/57bf684b53e8d5e1c26cccd8cb5eb09a94f167b8/LICENSE' -OutFile (Join-Path $licenses 'arabic-reshaper-MIT.txt')
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/MeirKriheli/python-bidi/v0.6.12/COPYING.LESSER' -OutFile (Join-Path $licenses 'python-bidi-LGPL-3.0.txt')

          $vcUrl = 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
          $vc = Join-Path $root 'build\vc_redist.x64.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $vc) | Out-Null
          Invoke-WebRequest -Uri $vcUrl -OutFile $vc
          $sig = Get-AuthenticodeSignature $vc
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Microsoft Visual C++ Redistributable signature verification failed.'
          }

      - name: Build and validate modern Qt Quick Achan application
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r requirements-qt.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing Qt build dependencies failed.' }
          python -c "import PySide6, shiboken6, dns.message, dns.rdatatype, requests; print('Qt Quick and networking dependencies: OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Qt or networking dependency import failed.' }
          python -m compileall -q main_qt.py core tools/validate_qml.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed.' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip dependency consistency check failed.' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          python tools/validate_qml.py
          if ($LASTEXITCODE -ne 0) { throw 'Qt Quick QML smoke test failed.' }
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue

          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Achan --icon assets/achan.ico --version-file version_info.txt --add-data "assets;assets" --add-data "qt_ui;qt_ui" --collect-all dns --collect-data certifi --hidden-import=dns.message --hidden-import=dns.rdatatype --hidden-import=PySide6.QtQuick --hidden-import=PySide6.QtQml --hidden-import=PySide6.QtQuickControls2 main_qt.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed to freeze the modern Qt Quick application.' }

          $app = Join-Path $env:GITHUB_WORKSPACE 'dist\Achan'
          if (-not (Test-Path (Join-Path $app 'Achan.exe'))) { throw 'Achan.exe was not produced.' }

          # PyInstaller's bootloader executable does not directly link to Qt DLLs.
          # Qt for Python therefore documents running windeployqt on the Qt DLLs
          # collected in the onedir output (not on the generic application EXE).
          $qtSdkRoot = $env:QT_SDK_ROOT
          $windeployqt = Join-Path $qtSdkRoot 'bin\windeployqt.exe'
          if (-not (Test-Path $windeployqt)) { throw "windeployqt.exe was not found in the matching Qt SDK: $windeployqt" }

          $qtQuickDll = Get-ChildItem -Path $app -Recurse -File -Filter 'Qt6Quick.dll' |
            Select-Object -First 1
          if (-not $qtQuickDll) {
            throw 'PyInstaller output does not contain Qt6Quick.dll; cannot deploy the Qt Quick runtime.'
          }
          $qtRuntimeBin = $qtQuickDll.Directory.FullName
          $qtRuntimeRoot = Split-Path $qtRuntimeBin -Parent
          $qtRuntimePlugins = Join-Path $qtRuntimeRoot 'plugins'
          $qtRuntimeQml = Join-Path $qtRuntimeRoot 'qml'
          New-Item -ItemType Directory -Force -Path $qtRuntimePlugins, $qtRuntimeQml | Out-Null

          $env:QTDIR = $qtSdkRoot
          $env:PATH = (Join-Path $qtSdkRoot 'bin') + ';' + $env:PATH
          $env:QML_IMPORT_PATH = Join-Path $qtSdkRoot 'qml'
          $env:QML2_IMPORT_PATH = Join-Path $qtSdkRoot 'qml'
          & $windeployqt `
            --dir $app `
            --libdir $qtRuntimeBin `
            --plugindir $qtRuntimePlugins `
            --qml-deploy-dir $qtRuntimeQml `
            --qmldir (Join-Path $env:GITHUB_WORKSPACE 'qt_ui') `
            --no-translations `
            $qtQuickDll.FullName
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE." }

          if (-not (Test-Path (Join-Path $qtRuntimeQml 'QtQuick'))) {
            throw "Qt Quick QML import modules were not deployed to: $qtRuntimeQml"
          }

          $bin = Join-Path $app 'bin'
          $licenses = Join-Path $app 'licenses'
          New-Item -ItemType Directory -Force -Path $bin, $licenses | Out-Null
          Copy-Item 'bin\tun2proxy-bin.exe' (Join-Path $bin 'tun2proxy-bin.exe') -Force
          Copy-Item 'bin\wintun.dll' (Join-Path $bin 'wintun.dll') -Force
          Copy-Item 'LICENSE-ORIGINAL-MIT.txt' (Join-Path $licenses 'WebImmortalGuards-MIT.txt') -Force
          Copy-Item 'licenses\*' $licenses -Force
          Copy-Item 'THIRD_PARTY_NOTICES.md' (Join-Path $app 'THIRD_PARTY_NOTICES.md') -Force
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AchanUpdater --workpath build\updater-work --distpath build\updater-dist --specpath build\updater-spec updater_helper.py
          if (-not (Test-Path 'build\updater-dist\AchanUpdater.exe')) { throw 'AchanUpdater.exe was not produced.' }
          Copy-Item 'build\updater-dist\AchanUpdater.exe' (Join-Path $app 'AchanUpdater.exe') -Force
      - name: Prepare Persian installer language
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $farsiUrl = 'https://raw.githubusercontent.com/jrsoftware/issrc/5bcadfcd05e9857a47a6880a2ac0694c9ab60122/Files/Languages/Unofficial/Farsi.isl'
          Invoke-WebRequest -Uri $farsiUrl -OutFile 'installer\Farsi.isl'
          if ((Get-Item 'installer\Farsi.isl').Length -lt 10000) { throw 'The Farsi installer translation download looks incomplete.' }

      - name: Compile installer and create portable/distribution packages
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" 'installer\Achan.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE" }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $setup = Join-Path $dist 'Achan-Setup-Windows-10-11-x64.exe'
          $portable = Join-Path $dist 'Achan-Portable-Windows-10-11-x64.zip'
          if (-not (Test-Path $setup)) { throw "Setup output was not produced: $setup" }

          Compress-Archive -Path (Join-Path $dist 'Achan') -DestinationPath $portable -CompressionLevel Optimal -Force
          $package = Join-Path $dist 'Achan-Distribution-Windows-10-11-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $setup $package -Force
          Copy-Item $portable $package -Force
          Copy-Item 'README_FA.md' $package -Force
          Get-ChildItem $package -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content (Join-Path $package 'SHA256SUMS.txt')
          $distribution = Join-Path $dist 'Achan-Distribution-Windows-10-11-x64.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $distribution -CompressionLevel Optimal -Force

          $setupItem = Get-Item $setup
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema_version = 1
            app_id = 'achan-desktop'
            version = $env:APP_VERSION
            tag = $env:RELEASE_TAG
            platform = 'windows-10-11-x64'
            installer = 'Achan-Setup-Windows-10-11-x64.exe'
            size_bytes = $setupItem.Length
            sha256 = $setupHash
            release_notes = (Get-Content 'RELEASE_NOTES_FA.md' -Raw)
          }
          $manifestPath = Join-Path $dist 'Achan-Update-Windows-10-11.json'
          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($manifestPath, $manifestJson, [System.Text.UTF8Encoding]::new($false))

      - name: Upload Windows 10/11 build artifact
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Achan-Windows-10-11-x64
          path: |
            dist/Achan-Setup-Windows-10-11-x64.exe
            dist/Achan-Portable-Windows-10-11-x64.zip
            dist/Achan-Distribution-Windows-10-11-x64.zip
            dist/Achan-Update-Windows-10-11.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows 10 and 11 GitHub Release
        if: steps.resolve.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $title = 'Achan — Windows 10 & 11'
          $notes = Get-Content 'RELEASE_NOTES_FA.md' -Raw
          $assets = @(
            'dist/Achan-Setup-Windows-10-11-x64.exe',
            'dist/Achan-Portable-Windows-10-11-x64.zip',
            'dist/Achan-Distribution-Windows-10-11-x64.zip',
            'dist/Achan-Update-Windows-10-11.json'
          )
          $assetNames = @($assets | ForEach-Object { Split-Path $_ -Leaf })

          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null
          $apiExitCode = $LASTEXITCODE
          if ($apiExitCode -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            $existingNames = @($release.assets | ForEach-Object { $_.name })
            $missingNames = @($assetNames | Where-Object { $_ -notin $existingNames })
            if ($release.immutable -eq $true) {
              if ($missingNames.Count -eq 0) {
                Write-Host "Immutable release $tag already contains every expected asset."
                exit 0
              }
              throw "Release $tag is immutable and is missing: $($missingNames -join ', '). Increase APP_VERSION before publishing again."
            }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading assets to release $tag failed." }
            if ($release.draft -eq $true) {
              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F draft=false -f "name=$title" -f "body=$notes" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Publishing draft release $tag failed." }
            } else {
              gh release edit $tag --title "$title" --notes "$notes"
              if ($LASTEXITCODE -ne 0) { throw "Updating release metadata for $tag failed." }
            }
          } else {
            gh release create $tag @assets --title "$title" --notes "$notes" --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Creating release $tag failed." }
          }
